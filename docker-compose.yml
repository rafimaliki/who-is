services:
  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      # Server-side: reaches SearXNG over the compose network, not the host-published port.
      - SEARXNG_URL=http://searxng:8080
      - GEMINI_API_KEY=${GEMINI_API_KEY:?set GEMINI_API_KEY in a .env file at the repo root}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-flash-latest}
    depends_on:
      - searxng

  frontend:
    build: ./frontend
    ports:
      - "4321:4321"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      # Client-side (runs in the browser on the host) — the host-published port, never the
      # compose network hostname.
      - PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  frontend_node_modules:
