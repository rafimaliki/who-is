services:
  # Result cache for searxng — repeat/near-repeat queries (normal during dev) get served from
  # here instead of re-hitting every upstream engine, which is what burns through their
  # per-network rate limits fastest. Ephemeral (no volume) - just a cache, fine to lose on restart.
  valkey:
    image: valkey/valkey:8-alpine
    command: valkey-server --save "" --appendonly no

  searxng:
    image: searxng/searxng:latest
    ports:
      - "8080:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_REDIS_URL=redis://valkey:6379/0
    depends_on:
      - valkey

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      # Server-side: reaches SearXNG over the compose network, not the host-published port.
      - SEARXNG_URL=http://searxng:8080
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:?set OPENROUTER_API_KEY in a .env file at the repo root}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-dots-studio/dots-3-note-preview:free}
      # Optional - paid fallback for when SearXNG's engines are rate-limited/blocked. Unset means
      # no fallback, same behavior as before this existed.
      - SERPAPI_KEY=${SERPAPI_KEY:-}
    depends_on:
      - searxng

  frontend:
    build: ./frontend
    ports:
      - "4321:4321"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      # Client-side (runs in the browser on the host) — the host-published port, never the
      # compose network hostname.
      - PUBLIC_API_BASE_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  frontend_node_modules:
